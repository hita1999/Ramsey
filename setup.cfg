[metadata]
name = book-ramsey-search
version = 0.1.0
description = Search and verification tools for two-color book Ramsey constructions
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.extras_require]
search =
    numba>=0.58
    numpy>=1.26
    scipy>=1.11
    tqdm>=4.66
analysis =
    matplotlib>=3.8
    networkx>=3.2
    python-sat>=1.8.dev1
    scikit-learn>=1.3
dev =
    pytest>=8
    ruff>=0.6

[options.entry_points]
console_scripts =
    book-ramsey = book_ramsey.cli:main
